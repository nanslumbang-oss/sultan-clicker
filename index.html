<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Idle Vlogger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Bar Atas (Cash, Pasif Income, & Gold) -->
  <header class="top-bar">
    <div class="stat">
      💵 <span id="cash">$0.00</span>
      <div id="passiveIncomeText" style="font-size: 0.65rem; color: #22c55e;">+$0.00/s</div>
    </div>
    <div class="stat gold-stat">🪙 <span id="gold">0</span></div>
  </header>


  <!-- 2. Panggung Utama (Tap Area & Visual Background) -->
  <main class="stage" id="tapArea">
    <div class="bg-tag" id="bgTag">🏠 Background: Perumahan Kampung</div>
    <div class="placeholder-char" id="charTag">👕 Baju: Polos</div>
  </main>

  <!-- 3. Navigasi Bawah (Buka Toko) -->
  <nav class="bottom-nav">
    <button id="openShopBtn">🛒 Keranjang & Tukar Gold</button>
  </nav>


  <!-- 4. Panel Toko (Pop-up Keranjang) -->
  <div class="shop-modal" id="shopModal">
    <div class="shop-content">
      <div class="shop-header">
        <h3>🛒 KERANJANG SULTAN</h3>
        <button id="closeShopBtn">✖</button>
      </div>

      <!-- Menu A: Tukar Cash ke Gold -->
      <div class="shop-section">
        <h4>🔂 Tukar Gold</h4>
        <div class="shop-item">
          <span>1 Gold = $100.00</span>
          <button id="buyGoldBtn">Tukar 🪙</button>
        </div>
      </div>

      <!-- Menu B: Upgrade Baju (Pakai Cash) -->
      <div class="shop-section">
        <h4>👕 Upgrade Baju</h4>
        <div class="shop-item">
          <span>Baju Branded ($50.00)</span>
          <button id="buyClothesBtn">Beli 💵</button>
        </div>
      </div>

            <!-- Menu C: Upgrade Background (Pakai Gold) -->
      <div class="shop-section">
        <h4>🌆 Pindah Background</h4>
        <div class="shop-item">
          <span>Kota Besar (100 Gold)</span>
          <button id="buyBgBtn">Pindah 🪙</button>
        </div>
      </div>


  <script src="script.js"></script>
</body>
</html>
