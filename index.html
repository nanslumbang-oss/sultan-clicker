<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Idle Vlogger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Bar Atas (Status Duit & Follower) -->
  <header class="top-bar">
    <div class="stat">💵 <span id="cash">$0</span></div>
    <div class="stat">👤 <span id="followers">0</span></div>
  </header>

  <!-- 2. Panggung Utama (Area tap dan tempat aset gambar lu nanti) -->
  <main class="stage" id="tapArea">
    <!-- Ini cuma kotak sementara, nanti diganti sama gambar PNG editan lu -->
    <div class="placeholder-char">Karakter Lu</div>
  </main>

  <!-- 3. Navigasi Bawah (Menu Upgrade) -->
  <nav class="bottom-nav">
    <button>🏠 Properti</button>
    <button>📷 Kamera</button>
    <button>👕 Baju</button>
    <button>🧠 Skill</button>
  </nav>

</body>
</html>
