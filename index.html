<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Idle Vlogger - Zero to Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Stats Bar -->
  <header class="top-bar">
    <div class="stat-pill">
      <span class="icon">💵</span>
      <div class="stat-info">
        <span id="cashText" class="val">$100</span>
        <span id="incomeText" class="sub">+$0.14/s</span>
      </div>
    </div>

    <div class="stat-pill">
      <span class="icon">👤</span>
      <div class="stat-info">
        <span id="followersText" class="val">89</span>
        <span class="sub">FOLLOWERS</span>
      </div>
    </div>

    <div class="stat-pill gem-pill">
      <span class="icon">🪙</span>
      <span id="gemsText" class="val">7</span>
    </div>
  </header>

  <!-- Stage Visual Scene -->
  <main class="stage-container" id="stageTapArea">
    <div class="rain-overlay"></div>
    
    <!-- Floating Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">LOSER!</div>

    <!-- Background Elements (House & Car) -->
    <div class="bg-house" id="houseVisual">🏚️ Garasi Kumuh</div>
    <div class="bg-car" id="carVisual">🚗 Mobil Reot</div>

    <!-- Character & Setup -->
    <div class="vlogger-setup">
      <div class="character" id="charVisual">🧙‍♂️ Gelandangan</div>
      <div class="tripod" id="camVisual">📱 HP & Tripod Patah</div>
    </div>

    <div class="tap-hint">Tap Layar Buat Ngevlog! 💸</div>
  </main>

  <!-- Bottom Navigation Tabs -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-tab="property">
      <span class="badge">2</span>
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Properti</span>
    </button>

    <button class="nav-tab" data-tab="equipment">
      <span class="badge">2</span>
      <span class="tab-icon">📷</span>
      <span class="tab-label">Kamera</span>
    </button>

    <button class="nav-tab" data-tab="outfit">
      <span class="badge">1</span>
      <span class="tab-icon">👕</span>
      <span class="tab-label">Pakaian</span>
    </button>

    <button class="nav-tab" data-tab="skill">
      <span class="badge">5</span>
      <span class="tab-icon">🧠</span>
      <span class="tab-label">Skill</span>
    </button>
  </nav>

  <!-- Upgrade Modal Drawer -->
  <div class="shop-drawer" id="shopDrawer">
    <div class="drawer-header">
      <h3 id="drawerTitle">UPGRADE PROPERTI</h3>
      <button class="close-btn" id="closeDrawer">✖</button>
    </div>
    <div class="drawer-list" id="drawerList">
      <!-- Item list di-generate script.js -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
